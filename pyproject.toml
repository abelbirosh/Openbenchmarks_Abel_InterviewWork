[build-system]
# 77 is where setuptools learned the PEP 639 `license`/`license-files` fields
# used below; older versions reject the SPDX string outright.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-bench"
version = "0.1.0"
description = "Turn a free-form request into a structured evaluation task spec."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",       # fetching the sources the ground-truth block finds
    "openai>=1.40",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.6", "mypy>=1.11"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
closed-bench = "closed_bench.cli:main"

[tool.setuptools.packages.find]
include = ["closed_bench*"]

[tool.setuptools.package-data]
"closed_bench.web" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Surface a mistyped marker or fixture as an error instead of a silent skip.
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error", "default::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear - likely bugs, not style
    "C4",   # comprehension rewrites
    "SIM",  # simplifications
    "RUF",  # ruff's own checks
]
ignore = [
    # The formatter wraps code; what is left over the limit is prose inside
    # string literals, where a hard break would hurt more than it helps.
    "E501",
    # The stopword list is written as prose and split at import time; exploding
    # it into a hundred-element list literal would only make it harder to edit.
    "SIM905",
]

[tool.ruff.lint.per-file-ignores]
# The test factories build kwargs with `dict(...)`; the keyword form is the
# point, and quoting every key would read worse.
"tests/*" = ["C408"]

[tool.ruff.lint.isort]
known-first-party = ["closed_bench"]

[tool.mypy]
python_version = "3.10"
files = ["closed_bench"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
# openai and pydantic ship types; fastapi is only installed with the web extra.
ignore_missing_imports = true
